spring:
  application:
    name: centralized-alert-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  lifecycle:
    timeout-per-shutdown-phase: 30s
  web:
    locale: en
    locale-resolver: fixed
  messages:
    fallback-to-system-locale: false

  # =========================
  # DATABASE
  # =========================
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/centralized_alert}
    username: ${DB_USERNAME:admin}
    password: ${DB_PASSWORD:admin_macbook}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: centralized-alert-pool
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      connection-timeout: 30000
      validation-timeout: 5000
      idle-timeout: 600000
      max-lifetime: 1800000

  # =========================
  # JPA / HIBERNATE
  # =========================
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: false
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true

  # =========================
  # FLYWAY
  # =========================
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true
    clean-disabled: true

  # =========================
  # SMTP EMAIL
  # =========================
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    protocol: smtp
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_STARTTLS_ENABLED:false}
            required: ${MAIL_STARTTLS_REQUIRED:false}
          connectiontimeout: ${MAIL_CONNECTION_TIMEOUT:5000}
          timeout: ${MAIL_READ_TIMEOUT:10000}
          writetimeout: ${MAIL_WRITE_TIMEOUT:10000}
        debug: ${MAIL_DEBUG:false}

  # =========================
  # KAFKA
  # =========================
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP:centralized-alert-consumer}
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.key.delegate.class: org.apache.kafka.common.serialization.StringDeserializer
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: ${KAFKA_TRUSTED_PACKAGES:com.mac.alert}
        spring.json.use.type.headers: true
        spring.json.value.default.type: com.mac.alert.entities.dto.CreateAlertEvent
    listener:
      ack-mode: record
      concurrency: ${KAFKA_CONSUMER_CONCURRENCY:3}
      missing-topics-fatal: false
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        enable.idempotence: true
        acks: all
        retries: 10

  # =========================
  # SECURITY / KEYCLOAK
  # =========================
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OAUTH2_ISSUER_URI:http://localhost:8080/realms/boilerplate}
          jwk-set-uri: ${OAUTH2_JWK_SET_URI:http://localhost:8080/realms/boilerplate/protocol/openid-connect/certs}

  # =========================
  # SCHEDULER
  # =========================
  task:
    scheduling:
      pool:
        size: ${SCHEDULER_POOL_SIZE:2}
      thread-name-prefix: alert-scheduler-
      shutdown:
        await-termination: true
        await-termination-period: 30s

  # =========================
  # FILE UPLOAD
  # =========================
  servlet:
    multipart:
      enabled: true
      max-file-size: ${MAX_ATTACHMENT_FILE_SIZE:10MB}
      max-request-size: ${MAX_ATTACHMENT_REQUEST_SIZE:25MB}
      file-size-threshold: 2MB

# =========================
# SERVER
# =========================
server:
  port: ${SERVER_PORT:9001}
  shutdown: graceful
  servlet:
    context-path: /
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
    include-exception: false
  compression:
    enabled: true
    mime-types:
      - application/json
      - application/problem+json
      - text/html
      - text/plain
      - text/css
      - application/javascript
    min-response-size: 1024

# =========================
# CENTRALIZED ALERT CONFIG
# =========================
alert:
  create:
    default-max-retry: ${ALERT_DEFAULT_MAX_RETRY:5}
    default-priority: ${ALERT_DEFAULT_PRIORITY:5}
  pickup:
    enabled: ${ALERT_PICKUP_ENABLED:true}
    interval: ${ALERT_PICKUP_INTERVAL:PT1M}
    initial-delay: ${ALERT_PICKUP_INITIAL_DELAY:PT10S}
    batch-size: ${ALERT_PICKUP_BATCH_SIZE:50}
  processing:
    max-retry: ${ALERT_MAX_RETRY:5}
    retry-initial-delay: ${ALERT_RETRY_INITIAL_DELAY:PT1M}
    retry-max-delay: ${ALERT_RETRY_MAX_DELAY:PT30M}
    processing-timeout: ${ALERT_PROCESSING_TIMEOUT:PT10M}
    max-parallelism: ${ALERT_MAX_RPARALLELISM:10}
  email:
    default-from: ${MAIL_DEFAULT_FROM:no-reply@example.com}
    default-from-name: ${MAIL_DEFAULT_FROM_NAME:Centralized Alert}
    reply-to: ${MAIL_REPLY_TO:}
    max-recipients: ${MAIL_MAX_RECIPIENTS:100}
    max-attachments: ${MAIL_MAX_ATTACHMENTS:10}
    max-total-attachment-size: ${MAIL_MAX_TOTAL_ATTACHMENT_SIZE:25MB}
  kafka:
    enabled: ${ALERT_KAFKA_ENABLED:true}
    topic: ${ALERT_KAFKA_TOPIC:centralized-alert.requested}
    create-topic: ${ALERT_KAFKA_CREATE_TOPIC:centralized-alert.create}
    dead-letter-topic: ${ALERT_KAFKA_DLT_TOPIC:centralized-alert.requested.dlt}
    error-handling:
      retry-interval-ms: ${ALERT_KAFKA_RETRY_INTERVAL_MS:1000}
      max-retries: ${ALERT_KAFKA_MAX_RETRIES:2}
  attachment:
    storage-type: ${ATTACHMENT_STORAGE_TYPE:LOCAL}
    max-file-size: ${ALERT_ATTACHMENT_MAX_FILE_SIZE:10MB}
    max-total-size: ${ALERT_ATTACHMENT_MAX_TOTAL_SIZE:25MB}
    local:
      base-directory: ${ATTACHMENT_LOCAL_DIRECTORY:./data/attachments}

# =========================
# MANAGEMENT / ACTUATOR
# =========================
management:
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include:
          - health
          - info
          - metrics
          - prometheus
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
    prometheus:
      access: unrestricted
  health:
    mail:
      enabled: false
    db:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
      environment: ${SPRING_PROFILES_ACTIVE:local}
    distribution:
      percentiles-histogram:
        http.server.requests: true

  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:0.1}

# =========================
# SHARED SDK
# =========================
sdk:
  logging:
    structured:
      enabled: true
      format: ecs
      auto-configure-format: true
      trace-header: X-Correlation-Id
      trace-response-header: true
    aspect:
      enabled: true
      packages: com.mac.alert.service,com.mac.alert.repository

# =========================
# LOGGING
# =========================
logging:
  level:
    root: ${LOG_LEVEL_ROOT:INFO}
    com.mac.alert: ${LOG_LEVEL_APPLICATION:INFO}
    org.springframework.kafka: ${LOG_LEVEL_KAFKA:INFO}
    org.springframework.security: ${LOG_LEVEL_SECURITY:INFO}
    org.hibernate.SQL: ${LOG_LEVEL_HIBERNATE_SQL:WARN}
    org.hibernate.orm.jdbc.bind: ${LOG_LEVEL_HIBERNATE_BIND:WARN}
    org.flywaydb: ${LOG_LEVEL_FLYWAY:DEBUG}
    org.springframework.boot.autoconfigure.flyway: ${LOG_LEVEL_FLYWAY:DEBUG}
  structured:
    format:
      console: ecs
      file: ecs
    ecs:
      service:
        environment: ${SPRING_PROFILES_ACTIVE:local}
